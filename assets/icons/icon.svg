<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#381f12" />
      <stop offset="50%" stop-color="#24130a" />
      <stop offset="100%" stop-color="#140a05" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe28a" />
      <stop offset="40%" stop-color="#e5b842" />
      <stop offset="100%" stop-color="#b8841e" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#e5b842" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Fond noyer arrondi -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.85" />
  
  <!-- Motif échiquier discret en arrière-plan -->
  <g opacity="0.12">
    <rect x="80" y="80" width="88" height="88" fill="#ffffff" />
    <rect x="256" y="80" width="88" height="88" fill="#ffffff" />
    <rect x="168" y="168" width="88" height="88" fill="#ffffff" />
    <rect x="344" y="168" width="88" height="88" fill="#ffffff" />
    <rect x="80" y="256" width="88" height="88" fill="#ffffff" />
    <rect x="256" y="256" width="88" height="88" fill="#ffffff" />
    <rect x="168" y="344" width="88" height="88" fill="#ffffff" />
    <rect x="344" y="344" width="88" height="88" fill="#ffffff" />
  </g>

  <!-- Roi d'Échecs Doré Haute Définition -->
  <g filter="url(#goldGlow)" fill="url(#goldGrad)" stroke="#664614" stroke-width="4" stroke-linejoin="round">
    <!-- Croix sommitale -->
    <rect x="246" y="65" width="20" height="65" rx="3" />
    <rect x="231" y="82" width="50" height="18" rx="3" />
    
    <!-- Tête / Couronne du Roi -->
    <path d="M155 170 Q210 205 256 185 Q302 205 357 170 L335 240 Q256 255 177 240 Z" />
    <circle cx="155" cy="170" r="12" />
    <circle cx="210" cy="190" r="10" />
    <circle cx="256" cy="175" r="11" />
    <circle cx="302" cy="190" r="10" />
    <circle cx="357" cy="170" r="12" />
    
    <!-- Collerette -->
    <rect x="175" y="245" width="162" height="22" rx="10" />
    
    <!-- Corps évasé -->
    <path d="M190 267 Q256 295 200 375 L312 375 Q256 295 322 267 Z" />
    
    <!-- Anneau inférieur -->
    <rect x="170" y="375" width="172" height="20" rx="8" />
    
    <!-- Socle majestueux -->
    <path d="M140 425 L372 425 L355 395 L157 395 Z" />
    <rect x="125" y="425" width="262" height="32" rx="12" />
  </g>
</svg>
